<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title> WickedMedia </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8f9fa;
            color: #202122;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-top: 80px;
        }

        .logo {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 14px;
            color: #54595d;
            margin-top: 6px;
        }

        .searchbox {
            margin-top: 30px;
        }

        .searchbox input {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 1px solid #a2a9b1;
            border-radius: 6px;
            outline: none;
            cursor: text;
        }

        .searchbox input:focus {
            border-color: #36c;
        }

        .results {
            margin-top: 40px;
        }

        .result {
            padding: 16px;
            background: white;
            border: 1px solid #eaecf0;
            border-radius: 6px;
            margin-bottom: 12px;
            transition: box-shadow 0.15s ease;
        }

        .result:hover {
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .result-title {
            font-size: 20px;
            color: #0645ad;
            cursor: pointer;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-url {
            font-size: 13px;
            color: #006621;
            margin-top: 3px;
        }

        .result-preview {
            font-size: 14px;
            color: #202122;
            margin-top: 6px;
            line-height: 1.5;
        }

    </style>
</head>

<script>
    document.addEventListener("keydown", function (e) {
        const active = document.activeElement;
        const isTyping =
            active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA" ||
            active.isContentEditable;

        const search = document.getElementById("search");

        // "/" → focus search (only if not already typing somewhere)
        if (!isTyping && e.key === "/") {
            e.preventDefault();
            if (search) search.focus();
        }

        // "Escape" → blur search if it's focused
        if (e.key === "Escape") {
            if (search && document.activeElement === search) {
                search.blur();
            }
        }
    });
</script>

<body>
    <div class="container">
        <div class="header">
            <div class="logo"> AskJennifer </div>
            <div class="tagline">Offline encyclopedia</div>
            <div class="searchbox">
                <input id="search" placeholder="Search WickedMedia">
            </div>
        </div>

        <div id="results" class="results"></div>
    </div>

    <script>
        const box = document.getElementById("search")
        const results = document.getElementById("results")

        box.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {
                const q = box.value.trim()
                if (q.length === 0) return

                const res = await fetch("/search", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({query: q})
                })
                const data = await res.json()
                results.innerHTML = ""

                data.forEach(item => {
                    const div = document.createElement("div")
                    div.className = "result"
                    div.innerHTML = `
                <div class="result-title" onclick="openArticle('${item.path}')">
                    ${item.title}
                </div>
                <div class="result-url">
                    /article/C/${item.path}.html
                </div>
            `
                    results.appendChild(div)
                })
            }
        })

        function openArticle(title) {
            window.location = "/article/C/" + encodeURIComponent(title) + ".html"
        }
    </script>
</body>

</html>
